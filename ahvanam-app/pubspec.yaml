name: ahvanam
description: "Ahvanam: Invitation Maker – Telugu & English invitations for Hindu, Muslim and Christian occasions."
publish_to: 'none'
version: 1.1.0+3

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  # Fonts are fetched once from Google Fonts and cached on device,
  # so they add nothing to the APK size.
  google_fonts: ^6.2.1
  gal: ^2.3.0                 # save to gallery (small native plugin)
  google_mobile_ads: ^9.2.0   # AdMob banner + interstitial (9.x builds with Gradle 9)
  path_provider: ^2.1.5
  pdf: ^3.11.1         # pure Dart PDF writer
  share_plus: ^13.3.1          # 13.x supports AGP 9 built-in Kotlin
  shared_preferences: ^2.3.3   # remembers the chosen tradition
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    # Starter illustrated designs (~160 KB) so the Illustrated tab works offline.
    - assets/templates/
    - assets/templates/art/
    - assets/templates/thumbs/
    - assets/brand/
    # Two built-in music tracks (~0.7 MB) so video music works offline.
    - assets/music/
